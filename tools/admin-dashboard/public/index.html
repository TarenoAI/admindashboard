<!doctype html>
<html lang="de" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#8251EE', hover: '#9366F5', subtle: 'rgba(130, 81, 238, 0.15)' },
                        neutral: { bg1: 'hsl(240, 6%, 6%)', bg2: 'hsl(240, 5%, 9%)', bg3: 'hsl(240, 5%, 12%)' },
                        text: { primary: '#FFFFFF', secondary: '#A1A1AA', muted: '#71717A' },
                        border: { subtle: 'hsla(0, 0%, 100%, 0.08)', default: 'hsla(0, 0%, 100%, 0.12)' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            background-color: theme('colors.neutral.bg1');
            color: theme('colors.text.primary');
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Background elements for glow */
        body::before,
        body::after {
            content: '';
            position: fixed;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.15;
            transition: all 1s ease;
        }

        body::before {
            background: #8251EE;
            top: -10vw;
            left: -10vw;
        }

        body::after {
            background: #3B82F6;
            bottom: -10vw;
            right: -10vw;
        }

        /* Glass Panels */
        .glass-sidebar {
            background: rgba(10, 10, 12, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid theme('colors.border.subtle');
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid theme('colors.border.default');
            border-radius: 1rem;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        pre {
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid theme('colors.border.subtle');
            padding: 0.75rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            max-height: 200px;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            color: theme('colors.text.secondary');
            transition: all 0.2s ease;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .nav-item:hover {
            background: theme('colors.brand.subtle');
            color: theme('colors.text.primary');
        }

        .nav-item.active {
            background: theme('colors.brand.DEFAULT');
            color: #fff;
            box-shadow: 0 0 15px theme('colors.brand.subtle');
        }

        .loader {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: theme('colors.brand.DEFAULT');
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
            }

            #sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                width: 82vw;
                max-width: 320px;
            }

            #sidebar.mobile-open {
                transform: translateX(0);
            }

            main {
                width: 100%;
            }

            #content-area {
                padding: 1rem;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-neutral-bg1 text-text-primary flex h-screen font-sans antialiased text-sm">

    <!-- Sidebar -->
    <aside id="sidebar" class="glass-sidebar w-64 flex flex-col h-full z-20">
        <div class="px-6 py-8">
            <h1
                class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-brand to-blue-400 flex items-center gap-2">
                <svg class="w-6 h-6 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z">
                    </path>
                </svg>
                OpenClaw
            </h1>
            <p class="text-xs text-text-muted mt-1 font-medium">Agent Operations</p>
        </div>

        <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
            <div class="nav-item active" onclick="switchTab('agents', this)">
                <span>🤖</span> Alle Agenten
            </div>
            <div class="nav-item" onclick="switchTab('organization', this)">
                <span>🏢</span> Organization
            </div>
            <div class="nav-item" onclick="switchTab('activity', this)">
                <span>⚡</span> Activity
            </div>
            <div class="nav-item" onclick="switchTab('cron', this)">
                <span>⏱️</span> Cron Jobs
            </div>
            <div class="nav-item" onclick="switchTab('projects', this)">
                <span>📂</span> Projekte
            </div>
            <div class="nav-item" onclick="switchTab('skills', this)">
                <span>🧠</span> Skills & Docs
            </div>
            <div class="nav-item" onclick="switchTab('channels', this)">
                <span>💬</span> Channels
            </div>
            <div class="nav-item" onclick="switchTab('agent-builder', this)">
                <span>🛠️</span> Agent Builder
            </div>
        </nav>

        <div class="p-4 border-t border-border-subtle">
            <div class="flex items-center gap-3 glass-card p-3 border-none bg-neutral-bg3/50">
                <div
                    class="w-8 h-8 rounded-full bg-brand flex items-center justify-center text-xs font-bold shadow-glow">
                    MK</div>
                <div>
                    <div class="text-xs font-medium">Admin User</div>
                    <div class="text-[10px] text-text-muted">Online</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative z-0">
        <header
            class="h-16 flex items-center justify-between px-4 md:px-8 border-b border-border-subtle backdrop-blur-md bg-transparent z-10 gap-2">
            <div class="flex items-center gap-2">
                <button id="mobile-menu-btn" onclick="toggleMobileMenu()"
                    class="md:hidden bg-white/5 hover:bg-white/10 border border-white/10 text-white px-2.5 py-1.5 rounded-lg text-xs">☰</button>
                <h2 id="view-title" class="text-base md:text-lg font-semibold tracking-wide">Alle Agenten</h2>
            </div>
            <button onclick="loadCurrentView()"
                class="bg-white/5 hover:bg-white/10 border border-white/10 text-white px-3 md:px-4 py-1.5 rounded-lg text-xs font-medium transition-all focus:ring-2 focus:ring-brand whitespace-nowrap">
                Refresh Data
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-8 animate-fade-in" id="content-area">
            <div class="flex items-center justify-center h-full">
                <div class="loader"></div>
            </div>
        </div>
    </main>

    <script>
        let currentTab = 'agents';
        let currentData = null;
        let selectedProject = null;
        let selectedAgent = null;
        let organizationAutoRefreshTimer = null;

        function switchTab(tabId, el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            currentTab = tabId;
            document.getElementById('view-title').innerText = el.innerText.substring(2).trim(); // Remove emoji
            configureAutoRefreshForTab();
            loadCurrentView();
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar')?.classList.remove('mobile-open');
            }
            // Update URL hash for direct linking
            window.location.hash = '#' + tabId;
        }

        function toggleMobileMenu() {
            document.getElementById('sidebar')?.classList.toggle('mobile-open');
        }

        function configureAutoRefreshForTab() {
            if (organizationAutoRefreshTimer) {
                clearInterval(organizationAutoRefreshTimer);
                organizationAutoRefreshTimer = null;
            }
            if (currentTab === 'organization' || currentTab === 'activity' || currentTab === 'cron') {
                organizationAutoRefreshTimer = setInterval(() => {
                    if (currentTab === 'organization' || currentTab === 'activity' || currentTab === 'cron') loadCurrentView();
                }, 20000);
            }
        }

        function formatBerlinDateTime(value) {
            if (!value) return '—';
            const d = new Date(value);
            if (Number.isNaN(d.getTime())) return value;
            return new Intl.DateTimeFormat('de-DE', {
                timeZone: 'Europe/Berlin',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            }).format(d);
        }

        function explainCronSchedule(schedule) {
            const s = String(schedule || '').trim();
            if (!s) return 'Keine Schedule-Info verfügbar.';

            if (/^every\s+/i.test(s)) {
                return `Intervall-Job: wird ${s} ausgeführt.`;
            }

            const parts = s.split(/\s+/);
            if (parts.length === 6) {
                const [sec, min, hour, day, month, weekday] = parts;
                return `6-Feld-Cron (Sekunde Minute Stunde Tag Monat Wochentag): ${sec} ${min} ${hour} ${day} ${month} ${weekday}.`;
            }
            if (parts.length === 5) {
                const [min, hour, day, month, weekday] = parts;
                return `5-Feld-Cron (Minute Stunde Tag Monat Wochentag): ${min} ${hour} ${day} ${month} ${weekday}.`;
            }

            return `Schedule: ${s}`;
        }

        async function loadCurrentView() {
            const container = document.getElementById('content-area');
            container.innerHTML = '<div class="flex items-center justify-center h-full"><div class="loader"></div></div>';

            try {
                if (currentTab === 'project-detail' && selectedProject?.id) {
                    const [projectsResp, agentsResp] = await Promise.all([
                        fetch('/api/projects'),
                        fetch('/api/agents')
                    ]);
                    const data = await projectsResp.json();
                    const agentsData = await agentsResp.json();
                    const refreshed = (data.projects || []).find(p => p.id === selectedProject.id) || selectedProject;
                    selectedProject = refreshed;
                    currentData = { project: refreshed, projects: data.projects || [], agents: agentsData.agents || [] };
                    renderView(currentTab, currentData, container);
                    setTimeout(() => runCapabilityChecksForProject(refreshed.id), 120);
                    return;
                }

                if (currentTab === 'agent-detail' && selectedAgent?.key) {
                    const response = await fetch(`/api/agent-files?agent=${encodeURIComponent(selectedAgent.key)}`);
                    const data = await response.json();
                    currentData = data;
                    renderView(currentTab, currentData, container);
                    return;
                }

                const response = await fetch(`/api/${currentTab}`);
                const data = await response.json();
                currentData = data;
                renderView(currentTab, data, container);
            } catch (err) {
                container.innerHTML = `<div class="glass-card p-6 border-red-500/30 bg-red-500/5 text-red-200">
          <h3 class="font-semibold mb-2 flex items-center gap-2"><span>⚠️</span> Error Loading View</h3>
          <p class="text-xs text-red-300/80">Konnte Daten von /api/${currentTab} nicht laden. Ist der Server online und sind alle Endpunkte in server.js implementiert?</p>
        </div>`;
            }
        }

        function renderView(tab, data, container) {
            let html = '';

            if (tab === 'agents') {
                const agents = data.agents || [];
                if (agents.length === 0) {
                    html = `<div class="glass-card p-10 flex flex-col items-center justify-center text-center gap-4">
                        <div class="text-5xl">🤖</div>
                        <h3 class="text-lg font-semibold text-white">Keine Agenten gefunden</h3>
                        <p class="text-sm text-text-muted max-w-sm">Lokal läuft kein OpenClaw – sobald du dich mit der VPS verbindest, erscheinen hier deine aktiven Agenten.</p>
                        <div class="mt-2 glass-card p-4 w-full max-w-lg text-left bg-black/40">
                          <p class="text-xs text-text-muted mb-1 font-medium uppercase tracking-wider">Debug Output</p>
                          <pre class="text-[10px] text-text-secondary m-0 border-none bg-transparent p-0 whitespace-pre-wrap">${(data.rawAgentOutput || 'Kein Output').slice(0, 400)}</pre>
                        </div>
                    </div>`;
                } else {
                    html = '<div class="grid grid-cols-1 xl:grid-cols-2 gap-6">';
                    agents.forEach(agent => {
                        const isActive = agent.status === 'active';
                        const statusColor = isActive ? 'bg-green-500/15 text-green-400 border-green-500/30' : 'bg-yellow-500/15 text-yellow-500 border-yellow-500/30';
                        const statusDot = isActive ? 'bg-green-400 shadow-[0_0_8px_rgba(34,197,94,0.8)]' : 'bg-yellow-400 shadow-[0_0_8px_rgba(234,179,8,0.8)]';
                        const tokens = agent.totalTokens != null ? Number(agent.totalTokens).toLocaleString('de-DE') : null;
                        const ageMin = agent.ageMs ? Math.round(agent.ageMs / 60000) : null;
                        const skills = agent.activeSkills || [];
                        const knowledge = agent.knowledgeFiles || {};
                        const knowledgePaths = agent.knowledgePaths || {};
                        const knowledgeOrder = [
                            { key: 'soul', label: 'SOUL' },
                            { key: 'memory', label: 'MEMORY' },
                            { key: 'agents', label: 'AGENTS' },
                            { key: 'user', label: 'USER' },
                            { key: 'heartbeat', label: 'HEARTBEAT' },
                            { key: 'identity', label: 'IDENTITY' }
                        ];
                        html += `<div class="glass-card overflow-hidden flex flex-col relative group">
                            <!-- Header glow -->
                            <div class="absolute top-0 inset-x-0 h-px bg-gradient-to-r from-transparent via-brand/50 to-transparent"></div>
                            <!-- Card Header -->
                            <div class="p-5 border-b border-white/5 bg-gradient-to-r from-black/30 to-transparent flex items-start gap-4">
                              <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-brand/30 to-blue-600/30 border border-brand/30 flex items-center justify-center text-2xl flex-shrink-0 shadow-[inset_0_0_20px_rgba(130,81,238,0.1)]">${agent.hasSoul ? '🧬' : '🤖'}</div>
                              <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="font-bold text-base text-white">${agent.name}</h3>
                                    <span class="px-2 py-0.5 rounded border border-white/10 bg-white/5 text-[9px] text-text-secondary font-mono">${agent.key || agent.agentId || 'no-id'}</span>
                                    <div class="px-2.5 py-0.5 rounded-full border text-[9px] uppercase font-bold tracking-wider flex items-center gap-1.5 ${statusColor}">
                                        <span class="w-1.5 h-1.5 rounded-full ${statusDot}"></span>${agent.status || 'unknown'}
                                    </div>
                                </div>
                                <p class="text-xs text-text-muted mt-0.5">${agent.role || 'Autonomous OpenClaw Agent'}</p>
                                ${agent.soul ? `<p class="text-[11px] text-text-secondary/80 mt-2 leading-relaxed italic border-l-2 border-brand/30 pl-2">${agent.soul.slice(0, 120)}${agent.soul.length > 120 ? '…' : ''}</p>` : ''}
                              </div>
                            </div>
                            <!-- Stats Grid -->
                            <div class="p-4 grid grid-cols-3 gap-2">
                              <div class="bg-black/30 border border-white/5 rounded-lg p-2.5 text-center">
                                <p class="text-[9px] text-text-muted uppercase tracking-wider mb-1">Model</p>
                                <p class="text-xs font-bold text-blue-300 truncate">${agent.model || '—'}</p>
                                <p class="text-[9px] text-text-muted mt-1 truncate">Fallback: ${(agent.fallbackModels && agent.fallbackModels.length) ? agent.fallbackModels.join(' → ') : (agent.fallbackModel || '—')}</p>
                                <p class="text-[9px] mt-1 ${agent.tokenRemainingPercent != null ? 'text-emerald-300' : 'text-text-muted'}">Rest: ${agent.tokenRemainingPercent != null ? `${agent.tokenRemainingPercent}%` : '—'}</p>
                              </div>
                              ${tokens ? `<div class="bg-black/30 border border-white/5 rounded-lg p-2.5 text-center"><p class="text-[9px] text-text-muted uppercase tracking-wider mb-1">Tokens</p><p class="text-xs font-bold text-green-300">${tokens}</p></div>` : ''}
                              ${ageMin != null ? `<div class="bg-black/30 border border-white/5 rounded-lg p-2.5 text-center"><p class="text-[9px] text-text-muted uppercase tracking-wider mb-1">Aktiv</p><p class="text-xs font-bold text-white">${ageMin}m</p></div>` : ''}
                              <div class="bg-black/30 border border-white/5 rounded-lg p-2.5 text-center">
                                <p class="text-[9px] text-text-muted uppercase tracking-wider mb-1">Wissen</p>
                                <p class="text-xs font-bold text-yellow-300">${agent.knowledgeScore || 0}/6</p>
                              </div>
                              <div class="bg-black/30 border border-white/5 rounded-lg p-2.5 text-center">
                                <p class="text-[9px] text-text-muted uppercase tracking-wider mb-1">Memory</p>
                                <p class="text-xs font-bold ${agent.hasMemory ? 'text-green-400' : 'text-text-muted'}">${agent.hasMemory ? '✓ Ja' : '—'}</p>
                              </div>
                              <div class="bg-black/30 border border-white/5 rounded-lg p-2.5 text-center">
                                <p class="text-[9px] text-text-muted uppercase tracking-wider mb-1">Soul</p>
                                <p class="text-xs font-bold ${agent.hasSoul ? 'text-brand' : 'text-text-muted'}">${agent.hasSoul ? '✓ Ja' : '—'}</p>
                              </div>
                            </div>
                            <!-- Knowledge Bank -->
                            <div class="px-4 pb-4">
                              <p class="text-[9px] text-text-muted uppercase tracking-wider mb-2 font-bold">Knowledge Bank</p>
                              <div class="flex flex-wrap gap-1.5">
                                ${knowledgeOrder.map(item => {
                            const present = !!knowledge[item.key];
                            return `<span class="px-2 py-0.5 border text-[10px] rounded-full font-medium ${present ? 'bg-green-500/10 border-green-500/30 text-green-300' : 'bg-black/20 border-white/10 text-text-muted'}">${item.label}</span>`;
                        }).join('')}
                              </div>
                              <div class="mt-2 space-y-1">
                                ${knowledgeOrder.map(item => knowledge[item.key] ? `<div class="text-[10px] text-text-muted font-mono truncate" title="${knowledgePaths[item.key] || ''}">${item.label}: ${knowledgePaths[item.key] || '—'}</div>` : '').join('')}
                              </div>
                            </div>
                            <!-- Active Skills -->
                            ${skills.length > 0 ? `
                            <div class="px-4 pb-4">
                              <p class="text-[9px] text-text-muted uppercase tracking-wider mb-2 font-bold">Skills</p>
                              <div class="flex flex-wrap gap-1.5">
                                ${skills.map(sk => `<span class="px-2 py-0.5 bg-brand/10 border border-brand/20 text-brand text-[10px] rounded-full font-medium">${sk}</span>`).join('')}
                              </div>
                            </div>` : ''}
                            <div class="px-4 pb-4">
                              <button onclick="openAgentDetail('${(agent.key || '').replace(/'/g, "\\'")}', '${(agent.name || '').replace(/'/g, "\\'")}')" class="w-full py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs font-semibold text-white">Knowledge-Dateien öffnen</button>
                            </div>
                        </div>`;
                    });
                    html += '</div>';
                }
            }

            else if (tab === 'organization') {
                const statusBadge = (s) => {
                    const map = {
                        online: 'bg-green-500/10 border-green-500/20 text-green-400',
                        active: 'bg-blue-500/10 border-blue-500/20 text-blue-400',
                        loaded: 'bg-purple-500/10 border-purple-500/20 text-purple-400',
                        idle: 'bg-yellow-500/10 border-yellow-500/20 text-yellow-500',
                        offline: 'bg-red-500/10 border-red-500/20 text-red-400',
                        group: 'bg-white/5 border-white/10 text-text-muted',
                        empty: 'bg-white/5 border-white/10 text-text-muted'
                    };
                    const dotMap = {
                        online: 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]',
                        active: 'bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.8)]',
                        loaded: 'bg-purple-500 shadow-[0_0_8px_rgba(168,85,247,0.8)]',
                        idle: 'bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.8)]',
                        offline: 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]',
                        group: 'bg-white/40',
                        empty: 'bg-white/40'
                    };
                    const cls = map[s] || map.idle;
                    const dotCls = dotMap[s] || dotMap.idle;
                    return `<div class="px-2.5 py-1 text-[10px] uppercase font-bold tracking-wider border rounded-full ${cls} flex items-center gap-1.5 backdrop-blur-md">
                        <span class="w-1.5 h-1.5 rounded-full ${dotCls}"></span>
                        ${s}
                    </div>`;
                };

                const getIconForRole = (role) => {
                    switch (role) {
                        case 'root': return '<div class="w-12 h-12 rounded-xl bg-gradient-to-br from-brand to-blue-600 p-[1px] shadow-[0_0_30px_rgba(130,81,238,0.3)]"><div class="w-full h-full bg-neutral-bg1 rounded-xl flex items-center justify-center text-2xl">🌍</div></div>';
                        case 'group': return '<div class="w-10 h-10 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-xl shadow-inner">📂</div>';
                        case 'agent': return '<div class="w-10 h-10 rounded-lg bg-green-500/10 border border-green-500/20 flex items-center justify-center text-xl text-green-400 shadow-[inset_0_0_20px_rgba(34,197,94,0.05)]">🤖</div>';

            await fetch('/api/projects/knowledge', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ projectId, title, content, kind })
            });
            loadCurrentView();
        };

        window.openCronRuns = async (jobId) => {
            const res = await fetch(`/api/cron/runs?id=${encodeURIComponent(jobId)}`);
            const data = await res.json();
            const entries = data.entries || data.data?.entries || [];
            const w = window.open('', '_blank');
            if (!w) return;
            const rows = entries.map(e => `<div style="padding:8px;border-bottom:1px solid #333"><b>${e.status || '—'}</b> • ${e.runAtMs ? new Date(e.runAtMs).toISOString() : '—'}<br/><small>${(e.summary || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</small></div>`).join('') || '<p>Keine Runs gefunden</p>';
            w.document.write(`<div style="font-family:system-ui;background:#111;color:#ddd;min-height:100vh;padding:16px"><h2>Cron Runs: ${jobId}</h2>${rows}</div>`);
            w.document.title = `Cron Runs ${jobId}`;
        };

        window.createAgentFromDashboard = async () => {
            const agentId = document.getElementById('new-agent-id')?.value?.trim();
            const agentName = document.getElementById('new-agent-name')?.value?.trim();
            const model = document.getElementById('new-agent-model')?.value;
            const telegramChatId = document.getElementById('new-agent-chat')?.value?.trim();
            const telegramToken = document.getElementById('new-agent-token')?.value?.trim();
            const out = document.getElementById('agent-builder-result');
            if (out) out.innerText = 'Erstelle Agent...';

            const res = await fetch('/api/agent-builder/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ agentId, agentName, model, telegramChatId, telegramToken })
            });
            const data = await res.json();
            if (out) out.innerText = data.success
                ? `✅ Agent ${data.agentId} erstellt und auf Telegram ${data.telegramChatId} gebunden.`
                : `❌ ${data.error || 'Fehler beim Anlegen'}`;
        };

        window.allowDrop = (ev) => ev.preventDefault();

        window.drag = (ev, projectId, taskId) => {
            ev.dataTransfer.setData("projectId", projectId);
            ev.dataTransfer.setData("taskId", taskId);
        };

        window.drop = async (ev, projectId, colId) => {
            ev.preventDefault();
            const sourceProjectId = ev.dataTransfer.getData("projectId");
            const taskId = ev.dataTransfer.getData("taskId");
            if (sourceProjectId !== projectId) return; // Prevent cross-project drops for now

            // Update local state without reload flicker
            const targetCol = document.getElementById(`col-${projectId}-${colId}`);
            const draggedEl = document.querySelector(`[draggable="true"][ondragstart*="${taskId}"]`);
            if (targetCol && draggedEl) {
                targetCol.insertBefore(draggedEl, targetCol.lastElementChild);
            }

            if (currentData && currentData.project && currentData.project.tasks) {
                const t = currentData.project.tasks.find(x => x.id === taskId);
                if (t) t.status = colId;
            }

            // Update Backend
            fetch(`/api/projects/${projectId}/tasks/${taskId}/move`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newStatus: colId })
            }).then(res => {
                if (!res.ok) throw new Error('Failed to move');
            }).catch(e => {
                console.error("Drag Drop Error", e);
                loadCurrentView(); // Only revert on fail
            });
        };

        window.openUploadModal = (projectId) => {
            selectedProject = currentData?.projects?.find(p => p.id === projectId);
            if (!selectedProject) return;
            document.getElementById('upload-modal-project-name').innerText = selectedProject.name;
            document.getElementById('upload-knowledge-modal').classList.remove('hidden');
        };

        window.closeUploadModal = () => {
            document.getElementById('upload-knowledge-modal').classList.add('hidden');
            document.getElementById('upload-title').value = '';
            document.getElementById('upload-content').value = '';
        };

        window.uploadKnowledge = async () => {
            if (!selectedProject) return;
            const title = document.getElementById('upload-title').value.trim();
            const content = document.getElementById('upload-content').value.trim();
            const type = document.getElementById('upload-type').value;
            const category = document.getElementById('upload-category').value;
            const btn = document.getElementById('upload-btn');

            if (!title || !content) {
                alert('Titel und Inhalt werden benötigt!');
                return;
            }

            btn.innerText = "Wird gespeichert...";
            btn.disabled = true;

            try {
                const res = await fetch(`/api/projects/${selectedProject.id}/knowledge`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content, type, category })
                });
                if (res.ok) {
                    closeUploadModal();
                    loadCurrentView();
                } else {
                    const err = await res.json();
                    alert('Fehler: ' + err.error);
                }
            } catch (e) {
                alert('Netzwerkfehler');
            } finally {
                btn.innerText = "Wissen speichern";
                btn.disabled = false;
            }
        };

        window.setGlobalSkills = async (enabled) => {
            await fetch('/api/skills/policy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ globalEnabled: !!enabled })
            });
            loadCurrentView();
        };

        window.setSkillPolicy = async (skill, enabled) => {
            const existing = currentData?.skills?.find(s => s.name === skill)?.activation?.agents || ['*'];
            await fetch('/api/skills/policy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ skill, enabled: !!enabled, agents: existing })
            });
            loadCurrentView();
        };

        window.setSkillAgents = async (skill, agentId) => {
            const cur = currentData?.skills?.find(s => s.name === skill)?.activation?.agents || ['*'];
            let next = [...cur];
            if (agentId === '*') {
                next = ['*'];
            } else {
                next = next.filter(a => a !== '*');
                next = next.includes(agentId) ? next.filter(a => a !== agentId) : [...next, agentId];
                if (next.length === 0) next = ['*'];
            }
            const enabled = currentData?.skills?.find(s => s.name === skill)?.activation?.enabled !== false;
            await fetch('/api/skills/policy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ skill, enabled, agents: next })
            });
            loadCurrentView();
        };

        // Init first view - check URL hash for direct navigation
        function initFromHash() {
            const hash = window.location.hash.replace('#', '');
            const validTabs = ['agents', 'organization', 'activity', 'cron', 'projects', 'skills', 'agent-builder'];
            if (hash && validTabs.includes(hash)) {
                currentTab = hash;
                document.getElementById('view-title').innerText = hash.charAt(0).toUpperCase() + hash.slice(1);
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                const nav = Array.from(document.querySelectorAll('.nav-item')).find(n => n.getAttribute('onclick')?.includes(`'${hash}'`));
                if (nav) nav.classList.add('active');
            }
        }
        initFromHash();
        configureAutoRefreshForTab();
        loadCurrentView();
    </script>

    <!-- Upload Knowledge Modal Overlay -->
    <div id="upload-knowledge-modal"
        class="hidden fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div
            class="glass-card w-full max-w-lg p-0 flex flex-col shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-white/10 rounded-2xl overflow-hidden animate-slide-up">
            <div
                class="p-5 border-b border-white/5 bg-gradient-to-r from-black/40 to-transparent flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-bold text-white flex items-center gap-2"><span class="text-brand">+</span>
                        Wissen hinzufügen</h3>
                    <p class="text-[10px] text-text-muted uppercase tracking-wider mt-1 font-bold"
                        id="upload-modal-project-name">Project</p>
                </div>
                <button onclick="closeUploadModal()"
                    class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 flex items-center justify-center text-text-muted hover:text-white transition-colors">✕</button>
            </div>
            <div class="p-5 flex flex-col gap-4">
                <div>
                    <label
                        class="block text-[10px] uppercase font-bold tracking-wider text-text-muted mb-1.5 ml-1">Titel /
                        Art</label>
                    <input id="upload-title" type="text"
                        class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand/50 transition-colors"
                        placeholder="z.B. Meeting Notes" />
                </div>
                <div>
                    <label
                        class="block text-[10px] uppercase font-bold tracking-wider text-text-muted mb-1.5 ml-1">Inhalt</label>
                    <textarea id="upload-content" rows="6"
                        class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand/50 transition-colors font-mono resize-none"
                        placeholder="Hier Text, Links oder Markdown einfügen..."></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label
                            class="block text-[10px] uppercase font-bold tracking-wider text-text-muted mb-1.5 ml-1">Format</label>
                        <select id="upload-type"
                            class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand/50 transition-colors">
                            <option value="md">Markdown (.md)</option>
                            <option value="txt">Text (.txt)</option>
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-[10px] uppercase font-bold tracking-wider text-text-muted mb-1.5 ml-1">Kategorie</label>
                        <select id="upload-category"
                            class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand/50 transition-colors">
                            <option value="Wissensbank">Wissensbank</option>
                            <option value="Ergebnisse">Ergebnisse</option>
                            <option value="Prozess">Prozess</option>
                            <option value="Dokumente">Dokumente</option>
                            <option value="Sonstiges">Sonstiges</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-white/5 bg-black/20 flex justify-end gap-3">
                <button onclick="closeUploadModal()"
                    class="px-4 py-2 border border-white/10 rounded-lg text-xs font-semibold text-text-muted hover:text-white hover:bg-white/5 transition-colors">Abbrechen</button>
                <button id="upload-btn" onclick="uploadKnowledge()"
                    class="px-4 py-2 border border-brand/30 bg-brand/20 rounded-lg text-xs font-bold text-brand hover:text-white hover:bg-brand/40 transition-colors shadow-[0_0_15px_rgba(130,81,238,0.2)]">Wissen
                    speichern</button>
            </div>
        </div>
    </div>
</body>

</html>
